apiVersion: v1
kind: ConfigMap
metadata:
  name: reverse-shell-sim
  namespace: lab-target
data:
  reverse_shell_sim.sh: |
    #!/usr/bin/env sh
    set -eu
    TARGET_HOST="${1:-lab-listener}"
    TARGET_PORT="${2:-4444}"
    echo "[lab] simulating outbound shell connection to ${TARGET_HOST}:${TARGET_PORT}"
    sh -c "exec 3<>/dev/tcp/${TARGET_HOST}/${TARGET_PORT} && echo lab-probe >&3" || true
    echo "[lab] simulation complete"
---
#A harmless listener the simulation connects out to, so the whole scenario
#stays inside the cluster and nothing reaches the real internet.
apiVersion: v1
kind: Pod
metadata:
  name: lab-listener
  namespace: lab-target
  labels:
    app.kubernetes.io/name: lab-listener
spec:
  restartPolicy: Never
  containers:
    - name: listener
      image: busybox:1.36
      command: ["sh", "-c", "nc -lk -p 4444 -e /bin/true"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: reverse-shell-sim
  namespace: lab-target
  labels:
    app.kubernetes.io/part-of: detection-as-code-lab
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reverse-shell-sim
    spec:
      restartPolicy: Never
      containers:
        - name: sim
          image: busybox:1.36
          command: ["sh", "/scripts/reverse_shell_sim.sh", "lab-listener", "4444"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: reverse-shell-sim
            defaultMode: 0755
