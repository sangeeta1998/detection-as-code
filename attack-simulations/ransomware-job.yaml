apiVersion: v1
kind: ConfigMap
metadata:
  name: ransomware-sim
  namespace: lab-target
data:
  ransomware_sim.sh: |
    #!/usr/bin/env sh
    set -eu
    TARGET_DIR="${1:-/data/lab-watched}"
    FILE_COUNT="${2:-200}"
    mkdir -p "${TARGET_DIR}"
    echo "[lab] rewriting ${FILE_COUNT} files under ${TARGET_DIR}"
    i=1
    while [ "$i" -le "$FILE_COUNT" ]; do
      echo "lab-rewrite-$(date +%s%N)" > "${TARGET_DIR}/lab-file-${i}.txt"
      i=$((i + 1))
    done
    echo "[lab] simulation complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ransomware-sim
  namespace: lab-target
  labels:
    app.kubernetes.io/part-of: detection-as-code-lab
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ransomware-sim
    spec:
      restartPolicy: Never
      containers:
        - name: sim
          image: busybox:1.36
          command: ["sh", "/scripts/ransomware_sim.sh", "/data/lab-watched", "200"]
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: scratch
              mountPath: /data
      volumes:
        - name: script
          configMap:
            name: ransomware-sim
            defaultMode: 0755
        - name: scratch
          emptyDir: {}
